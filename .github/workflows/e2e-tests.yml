name: E2E Test Suite

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:
    inputs:
      browser:
        description: 'Browser to run tests on'
        required: true
        default: 'chrome'
        type: choice
        options: [chrome, firefox, safari]
      test_suite:
        description: 'Test suite to run'
        required: false
        default: 'all'
        type: string

env:
  NODE_VERSION: '20.x'
  BASE_URL: ${{ secrets.BASE_URL }}
  WAIT_TIMEOUT: 10000
  RETRY_TIMEOUT: 5000

jobs:
  test:
    name: E2E Tests (${{ matrix.browser }})
    runs-on: macos-latest
    
    strategy:
      fail-fast: false
      matrix:
        browser: [chrome, firefox, safari]
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Setup Chrome and ChromeDriver
        if: matrix.browser == 'chrome'
        run: |
          LATEST_VERSION=$(curl -s https://googlechromelabs.github.io/chrome-for-testing/last-known-good-versions-with-downloads.json | jq -r '.channels.Stable.version')
          PLATFORM="mac-$(uname -m | sed 's/x86_64/x64/;s/arm64/arm64/')"
          TEMP_DIR=$(mktemp -d)
          cd "$TEMP_DIR"
          
          CHROME_URL=$(curl -s "https://googlechromelabs.github.io/chrome-for-testing/known-good-versions-with-downloads.json" | jq -r --arg VER "$LATEST_VERSION" --arg PLAT "$PLATFORM" '.versions[] | select(.version==$VER) | .downloads.chrome[] | select(.platform==$PLAT) | .url')
          DRIVER_URL=$(curl -s "https://googlechromelabs.github.io/chrome-for-testing/known-good-versions-with-downloads.json" | jq -r --arg VER "$LATEST_VERSION" --arg PLAT "$PLATFORM" '.versions[] | select(.version==$VER) | .downloads.chromedriver[] | select(.platform==$PLAT) | .url')
          
          echo "Downloading Chrome and ChromeDriver version $LATEST_VERSION for $PLATFORM..."
          curl -#fL "$CHROME_URL" -o chrome.zip && unzip -q chrome.zip
          curl -#fL "$DRIVER_URL" -o chromedriver.zip && unzip -q chromedriver.zip
          
          CHROME_PATH="$TEMP_DIR/chrome-$PLATFORM/Google Chrome for Testing.app/Contents/MacOS/Google Chrome for Testing"
          CHROMEDRIVER_PATH_SRC="$TEMP_DIR/chromedriver-$PLATFORM/chromedriver"
          
          chmod +x "$CHROME_PATH"
          sudo mv "$CHROMEDRIVER_PATH_SRC" /usr/local/bin/
          sudo chmod +x /usr/local/bin/chromedriver
          
          echo "CHROME_BINARY_PATH=$CHROME_PATH" >> $GITHUB_ENV
          
          echo "Verifying installations..."
          "$CHROME_PATH" --version
          chromedriver --version

      - name: Setup Firefox
        if: matrix.browser == 'firefox'
        uses: browser-actions/setup-firefox@v1
        with:
          firefox-version: 'latest'

      - name: Setup Safari
        if: matrix.browser == 'safari'
        run: |
          sudo safaridriver --enable
          echo "SAFARI_DRIVER_PATH=/usr/bin/safaridriver" >> $GITHUB_ENV

      - name: Install dependencies
        run: npm install

      - name: Create output directories
        run: mkdir -p tests_output/{screenshots,logs}

      - name: Run tests
        run: |
          BROWSER="${{ github.event.inputs.browser || matrix.browser }}"
          TEST_SUITE="${{ github.event.inputs.test_suite }}"
          
          if [ "$TEST_SUITE" = "all" ] || [ -z "$TEST_SUITE" ]; then
            npm run "test:$BROWSER"
          else
            npm run test:single "$TEST_SUITE" --env "$BROWSER"
          fi
          
      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.browser }}
          path: |
            tests_output/nightwatch-html-report/
            tests_output/screenshots/
            tests_output/*.{xml,json}
          retention-days: 30
          if-no-files-found: warn

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: html-report-${{ matrix.browser }}
          path: tests_output/nightwatch-html-report/index.html
          retention-days: 30