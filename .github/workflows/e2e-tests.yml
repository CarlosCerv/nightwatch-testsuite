name: E2E Test Suite

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  # Allow manual trigger
  workflow_dispatch:
    inputs:
      browser:
        description: 'Browser to run tests'
        required: true
        default: 'chrome'
        type: choice
        options:
          - chrome
          - firefox
          - headless
      test_suite:
        description: 'Test suite to run'
        required: false
        default: 'all'
        type: string

# Environment variables
env:
  NODE_VERSION: '20.x'
  BASE_URL: ${{ secrets.BASE_URL }}
  WAIT_TIMEOUT: 10000
  RETRY_TIMEOUT: 5000
  PARALLEL: true

jobs:
  test:
    name: E2E Tests
    runs-on: macos-latest  # Changed to macOS for Safari support
    
    strategy:
      matrix:
        browser: [chrome, firefox, safari]
      fail-fast: false # Continue with other browsers if one fails
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Setup Chrome
        if: matrix.browser == 'chrome' || github.event.inputs.browser == 'chrome' || github.event.inputs.browser == 'headless'
        uses: browser-actions/setup-chrome@latest
        with:
          chrome-version: 'stable'

      - name: Get Chrome version
        if: matrix.browser == 'chrome' || github.event.inputs.browser == 'chrome' || github.event.inputs.browser == 'headless'
        id: chrome-version
        run: |
          # Install chromium-browser to get google-chrome command
          if ! command -v google-chrome &> /dev/null; then
            brew install chromium
          fi
          
          # Get Chrome version and clean it up
          CHROME_FULL_VERSION=$(google-chrome --version || chromium-browser --version)
          CHROME_MAJOR_VERSION=$(echo "$CHROME_FULL_VERSION" | sed -n 's/.*Chrome \([0-9]*\).*/\1/p')
          
          # Verify we got a version number
          if [ -z "$CHROME_MAJOR_VERSION" ]; then
            echo "Failed to detect Chrome version"
            exit 1
          fi
          
          echo "Detected Chrome version: $CHROME_MAJOR_VERSION"
          echo "CHROME_VERSION=$CHROME_MAJOR_VERSION" >> $GITHUB_ENV
          echo "chrome_version=$CHROME_MAJOR_VERSION" >> $GITHUB_OUTPUT

      - name: Setup Firefox
        if: matrix.browser == 'firefox' || github.event.inputs.browser == 'firefox'
        uses: browser-actions/setup-firefox@v1
        with:
          firefox-version: 'latest-esr'

      - name: Install dependencies
        run: |
          npm ci
          npm install selenium-webdriver@latest

      - name: Install Chrome dependencies
        if: matrix.browser == 'chrome' || github.event.inputs.browser == 'chrome' || github.event.inputs.browser == 'headless'
        run: |
          echo "Installing dependencies for Chrome version $CHROME_VERSION"
          
          # First try exact version match
          if npm view chromedriver@$CHROME_VERSION version &> /dev/null; then
            npm install chromedriver@$CHROME_VERSION
          else
            # If exact version not found, try the latest minor version
            LATEST_DRIVER=$(npm view chromedriver versions --json | jq -r ".[] | select(startswith(\"$CHROME_VERSION.\"))" | sort -V | tail -n1)
            if [ -n "$LATEST_DRIVER" ]; then
              echo "Installing chromedriver version $LATEST_DRIVER"
              npm install chromedriver@$LATEST_DRIVER
            else
              # If no matching version found, try latest compatible version
              echo "No exact match found, installing latest compatible chromedriver"
              npm install chromedriver@latest
            fi
          fi
          
          # Verify installation and set path
          if [ -f "$(npm bin)/chromedriver" ]; then
            CHROMEDRIVER_PATH=$(npm bin)/chromedriver
            echo "CHROMEDRIVER_PATH=$CHROMEDRIVER_PATH" >> $GITHUB_ENV
            echo "Installed chromedriver at: $CHROMEDRIVER_PATH"
            chmod +x "$CHROMEDRIVER_PATH"
          else
            echo "Error: ChromeDriver installation failed"
            exit 1
          fi

      - name: Setup Firefox dependencies
        if: matrix.browser == 'firefox' || github.event.inputs.browser == 'firefox'
        run: |
          # Get Firefox version
          FIREFOX_VERSION=$(firefox --version | cut -d' ' -f3)
          echo "Firefox version: $FIREFOX_VERSION"
          
          # Download latest compatible geckodriver
          GECKO_VERSION=$(curl -s https://api.github.com/repos/mozilla/geckodriver/releases/latest | jq -r '.tag_name')
          echo "Latest GeckoDriver version: $GECKO_VERSION"
          
          # Download and extract geckodriver for arm64
          curl -L "https://github.com/mozilla/geckodriver/releases/download/${GECKO_VERSION}/geckodriver-${GECKO_VERSION}-macos-aarch64.tar.gz" -o geckodriver.tar.gz
          tar -xzf geckodriver.tar.gz
          
          # Make executable and move to a PATH location
          chmod +x geckodriver
          sudo mv geckodriver /usr/local/bin/
          
          # Verify installation
          GECKODRIVER_PATH=$(which geckodriver)
          echo "GECKODRIVER_PATH=$GECKODRIVER_PATH" >> $GITHUB_ENV
          echo "Using geckodriver from: $GECKODRIVER_PATH"
          geckodriver --version
          
          # Create logs directory
          mkdir -p logs

      - name: Run tests (Manual Trigger - Specific Browser)
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.browser != ''
        run: |
          if [ "${{ github.event.inputs.test_suite }}" = "all" ]; then
            npm run test:${{ github.event.inputs.browser }}
          else
            npm run test:single ${{ github.event.inputs.test_suite }} --env ${{ github.event.inputs.browser }}
          fi

      - name: Verify Chrome setup
        if: matrix.browser == 'chrome' || github.event.inputs.browser == 'chrome'
        run: |
          echo "Chrome version: $CHROME_VERSION"
          echo "ChromeDriver path: $CHROMEDRIVER_PATH"
          if [ -x "$CHROMEDRIVER_PATH" ]; then
            echo "ChromeDriver version info:"
            "$CHROMEDRIVER_PATH" --version
          else
            echo "Error: ChromeDriver is not executable"
            exit 1
          fi

      - name: Run tests (Matrix Strategy)
        if: github.event_name != 'workflow_dispatch'
        run: |
          if [ "${{ matrix.browser }}" = "chrome" ]; then
            echo "Running Chrome tests with ChromeDriver version matching Chrome $CHROME_VERSION"
            echo "ChromeDriver path: $CHROMEDRIVER_PATH"
            npm run test:chrome
          elif [ "${{ matrix.browser }}" = "firefox" ]; then
            echo "Running Firefox tests with GeckoDriver from: $GECKODRIVER_PATH"
            npm run test:firefox
          else
            npm run test:${{ matrix.browser }}
          fi

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.browser }}
          path: |
            tests_output/nightwatch-html-report/
            tests_output/screenshots/
            tests_output/
          retention-days: 30
          if-no-files-found: warn
          compression-level: 6

      - name: Upload Test Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report-${{ matrix.browser }}
          path: tests_output/nightwatch-html-report/index.html
          retention-days: 30

  notify:
    needs: test
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Notify Slack
        uses: 8398a7/action-slack@v3
        with:
          status: ${{ needs.test.result }}
          fields: repo,message,commit,author,action,eventName,ref,workflow,job,took
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        if: env.SLACK_WEBHOOK_URL != ''