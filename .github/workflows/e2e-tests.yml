name: E2E Test Suite

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  # Allow manual trigger
  workflow_dispatch:
    inputs:
      browser:
        description: 'Browser to run tests'
        required: true
        default: 'chrome'
        type: choice
        options:
          - chrome
          - firefox
          - headless
      test_suite:
        description: 'Test suite to run'
        required: false
        default: 'all'
        type: string

# Environment variables
env:
  NODE_VERSION: '20.x'
  BASE_URL: ${{ secrets.BASE_URL }}
  WAIT_TIMEOUT: 10000
  RETRY_TIMEOUT: 5000
  PARALLEL: true

jobs:
  test:
    name: E2E Tests
    runs-on: macos-latest  # Changed to macOS for Safari support
    
    strategy:
      matrix:
        browser: [chrome, firefox, safari]
      fail-fast: false # Continue with other browsers if one fails
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Setup Chrome
        if: matrix.browser == 'chrome' || github.event.inputs.browser == 'chrome' || github.event.inputs.browser == 'headless'
        uses: browser-actions/setup-chrome@latest
        with:
          chrome-version: 'stable'

      - name: Get Chrome version
        if: matrix.browser == 'chrome' || github.event.inputs.browser == 'chrome' || github.event.inputs.browser == 'headless'
        id: chrome-version
        run: |
          # On macOS, Chrome is installed by browser-actions/setup-chrome
          # The binary is located in '/Applications/Google Chrome.app'
          CHROME_APP="/Applications/Google Chrome.app/Contents/MacOS/Google Chrome"
          
          if [ ! -f "$CHROME_APP" ]; then
            echo "Chrome application not found at expected location"
            exit 1
          fi
          
          # Get Chrome version using the actual Chrome binary
          CHROME_FULL_VERSION=$("$CHROME_APP" --version)
          CHROME_MAJOR_VERSION=$(echo "$CHROME_FULL_VERSION" | awk '{print $3}' | cut -d. -f1)
          
          # Verify we got a version number
          if [ -z "$CHROME_MAJOR_VERSION" ]; then
            echo "Failed to detect Chrome version"
            exit 1
          fi
          
          echo "Detected Chrome version: $CHROME_MAJOR_VERSION"
          echo "CHROME_VERSION=$CHROME_MAJOR_VERSION" >> $GITHUB_ENV
          echo "chrome_version=$CHROME_MAJOR_VERSION" >> $GITHUB_OUTPUT
          
          # Verify Chrome installation
          echo "Full Chrome version info:"
          "$CHROME_APP" --version

      - name: Setup Firefox
        if: matrix.browser == 'firefox' || github.event.inputs.browser == 'firefox'
        uses: browser-actions/setup-firefox@v1
        with:
          firefox-version: 'latest-esr'

      - name: Install dependencies
        run: |
          # Remove existing lock file and node_modules to ensure clean state
          rm -f package-lock.json
          rm -rf node_modules
          
          # Install dependencies and generate new lock file
          npm install
          
          # Install additional dependencies
          npm install selenium-webdriver@latest
          
          # Show installed versions for debugging
          echo "Installed package versions:"
          npm list --depth=0

      - name: Install Chrome dependencies
        if: matrix.browser == 'chrome' || github.event.inputs.browser == 'chrome' || github.event.inputs.browser == 'headless'
        run: |
          echo "Installing dependencies for Chrome version $CHROME_VERSION"
          
          # Clean up any existing ChromeDriver installations
          rm -f $(which chromedriver) || true
          rm -rf node_modules/chromedriver
          
          # Install ChromeDriver using Homebrew
          echo "Installing ChromeDriver via Homebrew..."
          brew install --cask chromedriver
          
          # Start ChromeDriver to initialize it
          echo "Initializing ChromeDriver..."
          xattr -d com.apple.quarantine /usr/local/bin/chromedriver || true
          
          # Set permissions and environment
          sudo chmod +x /usr/local/bin/chromedriver
          echo "CHROMEDRIVER_PATH=/usr/local/bin/chromedriver" >> $GITHUB_ENV
          
          # Test ChromeDriver
          echo "Testing ChromeDriver..."
          /usr/local/bin/chromedriver --version
          
          # Start ChromeDriver and test connection
          echo "Testing ChromeDriver connection..."
          /usr/local/bin/chromedriver --port=9515 &
          CHROMEDRIVER_PID=$!
          
          # Wait for ChromeDriver to start
          sleep 5
          
          # Test connection
          if curl -s http://localhost:9515/status > /dev/null; then
            echo "ChromeDriver is responding on port 9515"
            kill $CHROMEDRIVER_PID || true
          else
            echo "Error: ChromeDriver not responding"
            kill $CHROMEDRIVER_PID || true
            exit 1
          fi
          
          # Install chromedriver with specific version handling
          install_chromedriver() {
            VERSION=$1
            echo "Attempting to install ChromeDriver version $VERSION..."
            npm install chromedriver@$VERSION --save-dev --no-audit
            return $?
          }
          
          # Try known stable versions that work with newer Chrome
          STABLE_VERSIONS=("119.0.0" "118.0.0" "117.0.0" "116.0.0" "115.0.0")
          
          # Try each stable version
          for VERSION in "${STABLE_VERSIONS[@]}"; do
            echo "Trying ChromeDriver version $VERSION..."
            if install_chromedriver $VERSION && verify_chromedriver; then
              echo "Successfully installed ChromeDriver $VERSION"
              exit 0
            fi
          done
          
          # If all stable versions fail, try latest
          echo "Trying latest version..."
          if npm install chromedriver@latest --save-dev --no-audit && verify_chromedriver; then
            echo "Successfully installed latest ChromeDriver"
            exit 0
          fi
          
          # If all attempts fail, try installing with Homebrew as fallback
          echo "Attempting Homebrew installation as fallback..."
          brew install --cask chromedriver
          if [ -f "/usr/local/bin/chromedriver" ]; then
            echo "CHROMEDRIVER_PATH=/usr/local/bin/chromedriver" >> $GITHUB_ENV
            chmod +x /usr/local/bin/chromedriver
            echo "Testing ChromeDriver from Homebrew..."
            /usr/local/bin/chromedriver --version
            exit 0
          fi
          
          echo "Error: All ChromeDriver installation attempts failed"
          exit 1

      - name: Setup Firefox dependencies
        if: matrix.browser == 'firefox' || github.event.inputs.browser == 'firefox'
        run: |
          # First fix npm vulnerabilities
          npm audit fix --force || true
          
          # Install geckodriver using npm
          npm install geckodriver@latest
          
          # Get the installed geckodriver path
          GECKODRIVER_PATH="$(pwd)/node_modules/.bin/geckodriver"
          echo "GECKODRIVER_PATH=$GECKODRIVER_PATH" >> $GITHUB_ENV
          
          # Ensure proper permissions
          chmod +x "$GECKODRIVER_PATH"
          
          # Create logs directory
          mkdir -p logs
          
          # Verify installation and version
          echo "GeckoDriver version information:"
          $GECKODRIVER_PATH --version
          
          # Test GeckoDriver connection with proper process management
          echo "Testing GeckoDriver connection..."
          # Start geckodriver in background and save PID
          $GECKODRIVER_PATH --port 4444 &
          GECKO_PID=$!
          
          # Wait for server to start
          sleep 5
          
          # Test connection
          if curl -s http://localhost:4444/ > /dev/null; then
            echo "GeckoDriver connection successful"
            kill $GECKO_PID || true
            wait $GECKO_PID 2>/dev/null || true
          else
            echo "Failed to connect to GeckoDriver"
            kill $GECKO_PID || true
            wait $GECKO_PID 2>/dev/null || true
            exit 1
          fi
          
          # Set Firefox binary path
          FIREFOX_BINARY=$(which firefox)
          echo "FIREFOX_BINARY=$FIREFOX_BINARY" >> $GITHUB_ENV
          echo "Using Firefox binary: $FIREFOX_BINARY"
          
          # Create required directories
          mkdir -p tests_output/screenshots
          mkdir -p tests_output/logs

      - name: Setup Safari
        if: matrix.browser == 'safari' || github.event.inputs.browser == 'safari'
        run: |
          # Kill any existing safaridriver processes
          pkill -f safaridriver || true
          sleep 2
          
          # Enable Safari Developer Menu and configure settings
          defaults write com.apple.Safari IncludeDevelopMenu -bool true
          defaults write com.apple.Safari AllowRemoteAutomation -bool true
          defaults write com.apple.Safari WebKitDeveloperExtrasEnabledPreferenceKey -bool true
          defaults write com.apple.Safari.SandboxBroker StartWhenSDKToolsRequestsAutomation -bool true
          defaults write com.apple.Safari WebKitPreferences.developerExtrasEnabled -bool true
          defaults write com.apple.Safari com.apple.Safari.ContentPageGroupIdentifier.WebKit2DeveloperExtrasEnabled -bool true
          
          # Enable SafariDriver
          sudo safaridriver --enable
          
          # Create required directories
          mkdir -p tests_output/screenshots tests_output/logs
          
          # Set environment variables
          echo "SAFARI_DRIVER_PATH=/usr/bin/safaridriver" >> $GITHUB_ENV
          
          # Start SafariDriver with diagnostic logging
          echo "Starting SafariDriver with diagnostic logging..."
          /usr/bin/safaridriver --diagnose -p 4444 &
          SAFARI_PID=$!
          
          # Wait for initialization
          echo "Waiting for SafariDriver to initialize..."
          sleep 10
          
          # Test connection multiple times
          MAX_RETRIES=3
          RETRY_COUNT=0
          SUCCESS=false
          
          while [ $RETRY_COUNT -lt $MAX_RETRIES ]; do
            if curl -s http://localhost:4444/status > /dev/null; then
              echo "SafariDriver is responding on port 4444"
              SUCCESS=true
              break
            else
              echo "Attempt $((RETRY_COUNT + 1)): SafariDriver not responding, waiting..."
              sleep 5
              RETRY_COUNT=$((RETRY_COUNT + 1))
            fi
          done
          
          if [ "$SUCCESS" = true ]; then
            echo "SafariDriver setup completed successfully"
          else
            echo "Error: SafariDriver failed to respond after $MAX_RETRIES attempts"
            # Collect diagnostic information
            ps aux | grep safaridriver
            echo "SafariDriver logs:"
            cat tests_output/logs/safaridriver.log 2>/dev/null || true
            exit 1
          fi

      - name: Run tests (Manual Trigger - Specific Browser)
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.browser != ''
        run: |
          if [ "${{ github.event.inputs.test_suite }}" = "all" ]; then
            npm run test:${{ github.event.inputs.browser }}
          else
            npm run test:single ${{ github.event.inputs.test_suite }} --env ${{ github.event.inputs.browser }}
          fi

      - name: Verify Chrome setup
        if: matrix.browser == 'chrome' || github.event.inputs.browser == 'chrome'
        run: |
          echo "Chrome version: $CHROME_VERSION"
          echo "ChromeDriver path: $CHROMEDRIVER_PATH"
          if [ -x "$CHROMEDRIVER_PATH" ]; then
            echo "ChromeDriver version info:"
            "$CHROMEDRIVER_PATH" --version
          else
            echo "Error: ChromeDriver is not executable"
            exit 1
          fi

      - name: Run tests (Matrix Strategy)
        if: github.event_name != 'workflow_dispatch'
        run: |
          if [ "${{ matrix.browser }}" = "chrome" ]; then
            echo "Running Chrome tests with ChromeDriver version matching Chrome $CHROME_VERSION"
            echo "ChromeDriver path: $CHROMEDRIVER_PATH"
            npm run test:chrome
          elif [ "${{ matrix.browser }}" = "firefox" ]; then
            echo "Running Firefox tests with GeckoDriver from: $GECKODRIVER_PATH"
            npm run test:firefox
          else
            npm run test:${{ matrix.browser }}
          fi

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.browser }}
          path: |
            tests_output/nightwatch-html-report/
            tests_output/screenshots/
            tests_output/
          retention-days: 30
          if-no-files-found: warn
          compression-level: 6

      - name: Upload Test Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report-${{ matrix.browser }}
          path: tests_output/nightwatch-html-report/index.html
          retention-days: 30

  notify:
    needs: test
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Notify Slack
        uses: 8398a7/action-slack@v3
        with:
          status: ${{ needs.test.result }}
          fields: repo,message,commit,author,action,eventName,ref,workflow,job,took
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        if: env.SLACK_WEBHOOK_URL != ''