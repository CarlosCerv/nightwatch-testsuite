name: E2E Test Suite

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:
    inputs:
      browser:
        description: 'Browser to run tests'
        required: true
        default: 'chrome'
        type: choice
        options: [chrome, firefox, safari]
      test_suite:
        description: 'Test suite to run'
        required: false
        default: 'all'
        type: string

env:
  NODE_VERSION: '20.x'
  BASE_URL: ${{ secrets.BASE_URL }}
  WAIT_TIMEOUT: 10000
  RETRY_TIMEOUT: 5000

jobs:
  test:
    name: E2E Tests
    runs-on: macos-latest
    
    strategy:
      matrix:
        browser: [chrome, firefox, safari]
      fail-fast: false
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Setup Chrome
        if: matrix.browser == 'chrome' || github.event.inputs.browser == 'chrome'
        run: |
          # Set up Chrome for Testing with a stable version
          PLATFORM="mac-$(uname -m | sed 's/x86_64/x64/;s/arm64/arm64/')"
          VERSION="114.0.5735.90"
          TEMP_DIR=$(mktemp -d)
          cd "$TEMP_DIR"
          
          echo "Setting up Chrome and ChromeDriver..."
          curl -Lo chrome.zip "https://storage.googleapis.com/chrome-for-testing-public/$VERSION/$PLATFORM/chrome-$PLATFORM.zip"
          curl -Lo chromedriver.zip "https://storage.googleapis.com/chrome-for-testing-public/$VERSION/$PLATFORM/chromedriver-$PLATFORM.zip"
          
          unzip -q chrome.zip
          unzip -q chromedriver.zip
          
          CHROME_PATH="$TEMP_DIR/chrome-$PLATFORM/chrome"
          chmod +x "$CHROME_PATH"
          
          sudo mv "chromedriver-$PLATFORM/chromedriver" /usr/local/bin/
          sudo chmod +x /usr/local/bin/chromedriver
          sudo xattr -d com.apple.quarantine /usr/local/bin/chromedriver 2>/dev/null || true
          
          echo "CHROME_BINARY_PATH=$CHROME_PATH" >> $GITHUB_ENV
          echo "CHROMEDRIVER_PATH=/usr/local/bin/chromedriver" >> $GITHUB_ENV
          
          # Test ChromeDriver
          chromedriver --port=9515 &
          sleep 2
          if curl -s http://localhost:9515/status > /dev/null; then
            echo "✓ ChromeDriver is working"
            pkill -f chromedriver
          else
            echo "✗ ChromeDriver failed to start"
            pkill -f chromedriver
            exit 1
          fi

      - name: Setup Firefox
        if: matrix.browser == 'firefox' || github.event.inputs.browser == 'firefox'
        uses: browser-actions/setup-firefox@v1
        with:
          firefox-version: 'latest-esr'

      - name: Setup Safari
        if: matrix.browser == 'safari' || github.event.inputs.browser == 'safari'
        run: |
          defaults write com.apple.Safari AllowRemoteAutomation -bool true
          defaults write com.apple.Safari.SandboxBroker StartWhenSDKToolsRequestsAutomation -bool true
          sudo safaridriver --enable
          echo "SAFARI_DRIVER_PATH=/usr/bin/safaridriver" >> $GITHUB_ENV

      - name: Install dependencies
        run: |
          npm ci
          npm install selenium-webdriver@latest

      - name: Create output directories
        run: mkdir -p tests_output/{screenshots,logs}

      - name: Run tests
        run: |
          BROWSER="${{ github.event.inputs.browser || matrix.browser }}"
          TEST_SUITE="${{ github.event.inputs.test_suite }}"
          
          if [ "$TEST_SUITE" = "all" ] || [ -z "$TEST_SUITE" ]; then
            npm run "test:$BROWSER"
          else
            npm run test:single "$TEST_SUITE" --env "$BROWSER"
          fi

      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.browser }}
          path: |
            tests_output/nightwatch-html-report/
            tests_output/screenshots/
            tests_output/*.{xml,json}
          retention-days: 30
          if-no-files-found: warn

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: html-report-${{ matrix.browser }}
          path: tests_output/nightwatch-html-report/index.html
          retention-days: 30

  notify:
    needs: test
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Notify Slack
        if: env.SLACK_WEBHOOK_URL != ''
        uses: 8398a7/action-slack@v3
        with:
          status: ${{ needs.test.result }}
          fields: repo,message,commit,author,action,eventName,ref,workflow,job,took
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}