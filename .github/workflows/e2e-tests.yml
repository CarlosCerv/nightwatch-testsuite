name: E2E Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        
    - name: Install dependencies
      run: npm ci
      
    - name: Install Chrome for Testing
      run: |
        # Create a directory for Chrome
        mkdir -p $HOME/chrome-for-testing
        cd $HOME/chrome-for-testing
        
        # Download Chrome directly from known URL for mac-arm64
        CHROME_VERSION="114.0.5735.90"
        CHROME_URL="https://edgedl.me.gvt1.com/edgedl/chrome/chrome-for-testing/$CHROME_VERSION/mac-arm64/chrome-mac-arm64.zip"
        DRIVER_URL="https://edgedl.me.gvt1.com/edgedl/chrome/chrome-for-testing/$CHROME_VERSION/mac-arm64/chromedriver-mac-arm64.zip"
        
        echo "Downloading Chrome from $CHROME_URL"
        curl -L $CHROME_URL -o chrome.zip
        
        echo "Downloading ChromeDriver from $DRIVER_URL"
        curl -L $DRIVER_URL -o chromedriver.zip
        
        # Extract the files
        unzip chrome.zip
        unzip chromedriver.zip
        
        # Set permissions
        chmod +x chrome-mac-arm64/Google\ Chrome\ for\ Testing.app/Contents/MacOS/Google\ Chrome\ for\ Testing
        chmod +x chromedriver-mac-arm64/chromedriver
        
        # Export the Chrome and ChromeDriver paths
        echo "CHROME_PATH=$HOME/chrome-for-testing/chrome-mac-arm64/Google Chrome for Testing.app/Contents/MacOS/Google Chrome for Testing" >> $GITHUB_ENV
        echo "CHROMEDRIVER_PATH=$HOME/chrome-for-testing/chromedriver-mac-arm64/chromedriver" >> $GITHUB_ENV
        
        # Verify installation
        echo "Verifying Chrome installation..."
        "$HOME/chrome-for-testing/chrome-mac-arm64/Google Chrome for Testing.app/Contents/MacOS/Google Chrome for Testing" --version
        
        echo "Verifying ChromeDriver installation..."
        "$HOME/chrome-for-testing/chromedriver-mac-arm64/chromedriver" --version
        
    - name: Run Nightwatch tests
      env:
        CHROME_PATH: ${{ env.CHROME_PATH }}
        CHROMEDRIVER_PATH: ${{ env.CHROMEDRIVER_PATH }}
      run: npm test